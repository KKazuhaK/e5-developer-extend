  scopes:
    delegated: [Mail.ReadBasic, Mail.Read, Mail.ReadWrite]
    app: [Mail.ReadBasic.All, Mail.Read, Mail.ReadWrite]
  default: true

- id: mail.rules
  category: mail
  name: Inbox rules
  delegated: /me/mailFolders/inbox/messageRules
  app: /users/{user}/mailFolders/inbox/messageRules
  scopes:
    delegated: [MailboxSettings.Read, MailboxSettings.ReadWrite]
    app: [MailboxSettings.Read, MailboxSettings.ReadWrite]
