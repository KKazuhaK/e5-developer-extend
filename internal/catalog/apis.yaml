  delegated: /me/insights/trending
  query:
    $top: ["5", "10"]
  scopes:
    delegated: [Sites.Read.All]
  default: true

- id: insights.used
  category: insights
  name: Used documents
  delegated: /me/insights/used
  query:
    $top: ["5", "10"]
  scopes:
    delegated: [Sites.Read.All]
  default: true

- id: insights.shared
  category: insights
  name: Shared documents
  delegated: /me/insights/shared
  query:
    $top: ["5", "10"]
  scopes:
    delegated: [Sites.Read.All]
