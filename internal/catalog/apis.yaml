- id: onenote.sections
  category: notes
  name: OneNote sections
  delegated: /me/onenote/sections
  query:
    $top: ["5", "10"]
  scopes:
    delegated: [Notes.Create, Notes.Read, Notes.Read.All]
  default: true

- id: todo.lists
  category: tasks
