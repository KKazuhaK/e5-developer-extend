# People API is in maintenance mode but still answers.
- id: people.list
  category: insights
  name: Relevant people
  delegated: /me/people
  query:
    $top: ["5", "10"]
    $select: ["id,displayName", "id,displayName,jobTitle"]
  scopes:
    delegated: [People.Read, People.Read.All]
  default: true

- id: presence.me
  category: presence
  name: Presence
  delegated: /me/presence
  app: /users/{user}/presence
  scopes:
    delegated: [Presence.Read, Presence.Read.All]
    app: [Presence.Read.All]
  default: true

# Off by default: not every tenant has Bookings turned on.
- id: bookings.businesses
  category: bookings
  name: Bookings businesses
  delegated: /solutions/bookingBusinesses
  app: /solutions/bookingBusinesses
  scopes:
    delegated: [Bookings.Read.All, Bookings.ReadWrite.All, Bookings.Manage.All]
    app: [Bookings.Read.All, Bookings.ReadWrite.All, Bookings.Manage.All]
  default: false

- id: bookings.currencies
  category: bookings
  name: Bookings currencies
  delegated: /solutions/bookingCurrencies
  app: /solutions/bookingCurrencies
  scopes:
    delegated: [Bookings.Read.All, Bookings.ReadWrite.All, Bookings.Manage.All]
    app: [Bookings.Read.All, Bookings.ReadWrite.All, Bookings.Manage.All]
  default: false

# Needs an Entra reporting admin role when signed in as a user; answers with a
# 302 redirect to a CSV. Off by default.
- id: reports.active
  category: reports
  name: Active user report
  delegated: /reports/getOffice365ActiveUserDetail(period='D7')
  app: /reports/getOffice365ActiveUserDetail(period='D7')
  scopes:
    delegated: [Reports.Read.All]
    app: [Reports.Read.All]
  default: false
