name: Service E2E

# Installs the background job on real runners, crashes the engine and checks
# that the OS brings it back. Runs only on throwaway CI machines.
on:
  push:
    branches: [main]
  # On pull requests only when something the service depends on changes.
  pull_request:
    paths:
      - "internal/**"
      - "scripts/service-e2e*.sh"
      - "cmd/e5extend/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/service-e2e.yml"
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels its stale run; each main push gets its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Ignore any go.work file so CI builds only this module.
  GOWORK: "off"

jobs:
  service:
    name: Service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install, crash, restart, uninstall
        shell: bash
        run: bash scripts/service-e2e.sh
      - name: Headless task (S4U, boot trigger, DPAPI key file)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/service-e2e-headless.sh
      - name: Engine log
        if: always()
        shell: bash
        run: |
          for f in "$HOME/.local/share/e5extend/engine.log" \
                   "$HOME/Library/Application Support/e5extend/engine.log" \
                   "$HOME/Library/Logs/e5extend/engine.log" \
                   "${LOCALAPPDATA:-/nonexistent}/e5extend/engine.log"; do
            [ -f "$f" ] && { echo "--- $f"; tail -n 50 "$f"; }
          done
          if command -v journalctl >/dev/null; then journalctl --user -u e5extend -n 50 --no-pager || true; fi
