# Desktop package: /usr/bin/e5extend-gui. The background service runs the
# command-line program, which the app looks for next to itself, so this
# package depends on the e5extend package of the same version. PKG_VERSION is
# VERSION as nfpm writes it into packages (a pre-release "-" becomes "~").
name: e5extend-desktop
arch: ${GOARCH}
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: KKazuhaK <KKazuhaK@users.noreply.github.com>
description: |
  E5 Developer Extend desktop app (tray icon and window).
  Keeps a Microsoft 365 E5 developer tenant active by calling read-only
  Microsoft Graph APIs on a randomized schedule.
vendor: KKazuhaK
homepage: https://github.com/KKazuhaK/e5-developer-extend
license: MIT

# GTK4 and WebKitGTK 6.0: Ubuntu 24.04+, Debian 13+, Fedora 39+.
depends:
  - e5extend (= ${PKG_VERSION}-1)
  - libgtk-4-1
  - libwebkitgtk-6.0-4
overrides:
  rpm:
    depends:
      - e5extend = ${PKG_VERSION}-1
      - gtk4
      - webkitgtk6.0

contents:
  - src: dist/stage/e5extend-gui
    dst: /usr/bin/e5extend-gui
    file_info:
      mode: 0755
  - src: packaging/linux/io.github.kkazuhak.e5extend.desktop
    dst: /usr/share/applications/io.github.kkazuhak.e5extend.desktop
    file_info:
      mode: 0644
  - src: packaging/icons/appicon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.kkazuhak.e5extend.png
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/e5extend-desktop/copyright
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/linux/scripts/desktop-refresh.sh
  postremove: packaging/linux/scripts/desktop-refresh.sh
